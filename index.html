<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c9beb0" />
  <title>Hanging Media Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main id="app">
    <section id="stage-shell" aria-label="Interactive hanging media preview">
      <canvas id="stage"></canvas>
      <div id="loading" class="loading is-hidden">Preparing media…</div>
      <div class="stage-badge">HANGING MEDIA / LIVE PREVIEW</div>
      <div class="stage-hint">Drag to slide · grab a sheet to deform · wheel to move</div>
    </section>

    <aside id="authoring-panel" aria-label="Hanging media controls">
      <header class="panel-header">
        <div>
          <p class="eyebrow">LIVE COMPONENT</p>
          <h1>Hanging Media Studio</h1>
        </div>
        <button id="reset-all" class="icon-button" type="button" title="Reset">↺</button>
      </header>

      <section class="control-section">
        <h2>Content</h2>
        <div id="media-slots" class="media-slots"></div>
        <label class="upload-button" for="media-upload">+ Add images or video</label>
        <input id="media-upload" type="file" accept="image/*,video/*" multiple hidden />
      </section>

      <section class="control-section">
        <h2>Carousel</h2>
        <label>Photos in view <output data-out="inView"></output><input data-control="inView" type="range" min="1" max="6" step="1" /></label>
        <label>Photo gap <output data-out="gap"></output><input data-control="gap" type="range" min="0.25" max="1.8" step="0.01" /></label>
        <label>Auto drift <output data-out="autoDrift"></output><input data-control="autoDrift" type="range" min="0" max="0.08" step="0.001" /></label>
        <label>Scroll response <output data-out="scrollResponse"></output><input data-control="scrollResponse" type="range" min="0.1" max="1.6" step="0.01" /></label>
        <label>Glide <output data-out="glide"></output><input data-control="glide" type="range" min="0.02" max="0.35" step="0.01" /></label>
        <label>Slide sway <output data-out="slideSway"></output><input data-control="slideSway" type="range" min="0" max="1" step="0.01" /></label>
        <label>Wall parallax <output data-out="parallax"></output><input data-control="parallax" type="range" min="0" max="0.2" step="0.005" /></label>
        <label class="toggle-row"><span>Drag to slide</span><input data-control="dragToSlide" type="checkbox" /></label>
      </section>

      <section class="control-section">
        <h2>Fabric</h2>
        <label>Clips per photo <select data-control="clips"><option>2</option><option>3</option></select></label>
        <label>Stiffness <output data-out="stiffness"></output><input data-control="stiffness" type="range" min="0.45" max="1" step="0.01" /></label>
        <label>Weight <output data-out="weight"></output><input data-control="weight" type="range" min="0.4" max="4" step="0.05" /></label>
        <label>Spring back <output data-out="springBack"></output><input data-control="springBack" type="range" min="0.05" max="0.8" step="0.01" /></label>
        <label>Wind <output data-out="wind"></output><input data-control="wind" type="range" min="0" max="1.5" step="0.01" /></label>
        <label>White border <output data-out="border"></output><input data-control="border" type="range" min="0" max="0.16" step="0.005" /></label>
        <label>Mesh detail <select data-control="meshDetail"><option value="draft">Draft</option><option value="standard">Standard</option><option value="fine">Fine</option></select></label>
      </section>

      <section class="control-section">
        <h2>Lighting</h2>
        <div class="segmented" data-preset-group="lighting">
          <button type="button" data-preset="studio">Studio</button><button type="button" data-preset="golden">Golden</button><button type="button" data-preset="overcast">Overcast</button><button type="button" data-preset="dramatic">Dramatic</button>
        </div>
        <label>Key light <output data-out="keyLight"></output><input data-control="keyLight" type="range" min="0" max="6" step="0.05" /></label>
        <label>Key direction <output data-out="keyDirection"></output><input data-control="keyDirection" type="range" min="-180" max="180" step="1" /></label>
        <label>Fill light <output data-out="fill"></output><input data-control="fill" type="range" min="0" max="3" step="0.05" /></label>
        <label>Ambient <output data-out="ambient"></output><input data-control="ambient" type="range" min="0" max="2" step="0.05" /></label>
        <label>Exposure <output data-out="exposure"></output><input data-control="exposure" type="range" min="0.3" max="1.8" step="0.01" /></label>
      </section>

      <section class="control-section">
        <h2>Wall & scene</h2>
        <div class="segmented" data-preset-group="wall">
          <button type="button" data-preset="concrete">Concrete</button><button type="button" data-preset="plaster">Plaster</button><button type="button" data-preset="flat">Flat</button>
        </div>
        <label>Relief depth <output data-out="relief"></output><input data-control="relief" type="range" min="0" max="5" step="0.1" /></label>
        <label>Backdrop <input data-control="backdrop" type="color" /></label>
        <label>Vignette <output data-out="vignette"></output><input data-control="vignette" type="range" min="0" max="0.6" step="0.01" /></label>
        <label class="toggle-row"><span>Wire & clips</span><input data-control="hardware" type="checkbox" /></label>
      </section>

      <section class="control-section footer-actions">
        <button id="save-config" class="secondary-button" type="button">Save preset</button>
        <button id="clear-media" class="danger-button" type="button">Clear uploaded media</button>
      </section>
    </aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
