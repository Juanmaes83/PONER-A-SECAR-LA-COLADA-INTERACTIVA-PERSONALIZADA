name: Validate V5.1 3D Asset Library

on:
  push:
    branches:
      - agent/hanging-media-studio-v5-1-asset-library
      - fix/v5-1-phase1-core-3d
  workflow_dispatch:

jobs:
  build-and-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Syntax checks
        run: |
          node --check src/media-runtime-v2.js
          node --check src/scene-asset-runtime.js
          node --check src/v5-1-asset-library-v2.js
          node --check src/v5-1-phase1-hardening.js
          node --check src/v5-1-external-assets.js
          node --check src/v5-1-character-library.js
          node --check scripts/visual-check-v5-1-phase1.mjs
          node --check scripts/visual-check-v5-1-asset-library.mjs
          node --check scripts/visual-check-v5-1-external.mjs
          node --check scripts/visual-check-v5-1.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/v5-1-library.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v5-1-library.log
          exit 1
      - name: Phase 1 real product regression QA
        run: node scripts/visual-check-v5-1-phase1.mjs
      - name: Multi-asset library browser QA
        run: node scripts/visual-check-v5-1-asset-library.mjs
      - name: Existing external package QA
        run: node scripts/visual-check-v5-1-external.mjs
      - name: Existing V5.1 regression QA
        run: node scripts/visual-check-v5-1.mjs
      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-1-phase1-qa
          path: artifacts
          if-no-files-found: warn
